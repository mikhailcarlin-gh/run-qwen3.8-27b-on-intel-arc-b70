# Qwen3.8-27B on an Intel Arc GPU via SYCL/Level Zero.
#
#   Windows (Docker Desktop, WSL2 backend):  docker compose --profile wsl2  up --build
#   Linux (bare metal, Intel GPU driver):    docker compose --profile linux up --build
#
# The model files are mounted from the host, never baked into the image:
# MODELS_DIR defaults to this repo's root (where setup.* downloads the GGUFs).

name: qwen3.8-27b-arc

volumes:
  # Compiled SYCL kernels + saved slot state. Survives container rebuilds,
  # so the first prompt compiles the kernels and later starts are fast.
  sycl-cache:

services:
  # --- Windows: Docker Desktop / WSL2 backend ---
  # The GPU is reached through the WSL2 paravirtual driver (/dev/dxg); the
  # Level Zero userspace comes from the WSL driver mounts. No privileged
  # mode needed. Verified with an Arc Pro B70: microsoft/WSL#41376.
  wsl2:
    image: qwen3.8-27b-arc:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [wsl2]
    container_name: qwen3.8-27b
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      # Defaults mirror start.sh - override here (or via a .env file) to change.
      MODEL_PATH: /models/Qwen3.8-27B-UD-Q4_K_M.gguf
      MMPROJ_PATH: /models/mmproj-Qwen3.8-27B-BF16.gguf
    volumes:
      - ${MODELS_DIR:-.}:/models:ro
      - sycl-cache:/cache
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
    devices:
      - /dev/dxg

  # --- Linux: bare metal ---
  # Needs the Intel GPU kernel driver (i915); the user must be in the
  # `render` group (some setups also `video`).
  # If your render node is not renderD128, check:  ls -la /dev/dri
  linux:
    image: qwen3.8-27b-arc:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [linux]
    container_name: qwen3.8-27b
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      MODEL_PATH: /models/Qwen3.8-27B-UD-Q4_K_M.gguf
      MMPROJ_PATH: /models/mmproj-Qwen3.8-27B-BF16.gguf
    volumes:
      - ${MODELS_DIR:-.}:/models:ro
      - sycl-cache:/cache
    devices:
      - /dev/dri/renderD128
      - /dev/dri/card0
    group_add:
      - render
